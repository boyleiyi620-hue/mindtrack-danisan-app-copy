name: Build web bundles

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[web-build]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Build web bundles
        env:
          SUPABASE_URL: https://aqswdmhwqhrsempoiqfv.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ugqE_bZ_IyNedJMk1I_saA_-eMtQAjE
        run: |
          flutter pub get
          node scripts/test_service_worker.mjs
          node scripts/test_security_headers.mjs
          node scripts/test_record_schema.mjs
          node scripts/test_tenant_schema.mjs
          flutter test
          ./scripts/build_web.sh

      - name: Commit generated bundles
        run: |
          git config user.name 'MindTrack Web Build'
          git config user.email 'actions@users.noreply.github.com'
          git add -f build/client build/psych
          git commit -m 'Build web bundles [web-build]' || exit 0
          git push
