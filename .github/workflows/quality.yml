name: Quality checks

# Dağıtım iş akışını bozmamak için kalite kontrolleri ayrı tutulur.
# master'a doğrudan push yapıldığında da çalışır, ancak web paketini
# üretmez; yalnızca uyarıları ve testleri raporlar.
on:
  pull_request:
  push:
    branches-ignore: ['master']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts

      - name: Install dependencies
        run: flutter pub get

      - name: Service worker checks
        run: node scripts/test_service_worker.mjs

      - name: Security header checks
        run: node scripts/test_security_headers.mjs

      - name: Observability schema checks
        run: node scripts/test_observability_schema.mjs

      - name: Backup schema checks
        run: node scripts/test_backup_schema.mjs

      - name: Operational configuration checks
        run: node scripts/test_operational_config.mjs

      - name: Edge Function type check
        run: deno check supabase/functions/critical-error-alert/index.ts

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test
