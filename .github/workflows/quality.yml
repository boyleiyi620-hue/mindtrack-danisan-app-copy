name: Quality checks

# Dağıtım iş akışını bozmamak için kalite kontrolleri ayrı tutulur.
# master'a doğrudan push yapıldığında da çalışır, ancak web paketini
# üretmez; yalnızca uyarıları ve testleri raporlar.
on:
  pull_request:
  push:
    branches-ignore: ['master']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Service worker checks
        run: node scripts/test_service_worker.mjs

      - name: Security header checks
        run: node scripts/test_security_headers.mjs

      - name: Observability schema checks
        run: node scripts/test_observability_schema.mjs

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test
