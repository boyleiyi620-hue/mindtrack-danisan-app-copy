name: Web uptime check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check production health endpoint
        env:
          MINDTRACK_HEALTH_URL: ${{ vars.MINDTRACK_HEALTH_URL }}
        run: |
          if [ -z "$MINDTRACK_HEALTH_URL" ]; then
            echo 'Repository variable MINDTRACK_HEALTH_URL is required.' >&2
            exit 2
          fi
          node scripts/check_uptime.mjs "$MINDTRACK_HEALTH_URL" 3
